<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Box Scanner</title>

    manifest.json

    <meta name="theme-color" content="#1976d2">

    <link rels

    <script src="https://cdn.jsdelivr.net/npmsx.full.min.jsscript>

</head>

<body>

    <h2>📦 Box Scanner</h2>

    <div class="card">

        <input
            type="file"
            id="excelFile"
            accept=".xlsx,.xls">

        <button onclick="testExcel()">
            📊 Проверить Excel
        </button>

    </div>

    <div id="reader"></div>

    <div class="card">

        <div class="stats">

            <div class="stat men">
                MEN
                <br>
                <span id="menCount">0</span>
            </div>

            <div class="stat women">
                WOMEN
                <br>
                <span id="womenCount">0</span>
            </div>

            <div class="stat kids">
                KIDS
                <br>
                <span id="kidsCount">0</span>
            </div>

        </div>

    </div>

    <div class="card">

        <div id="result">
            Готов к работе
        </div>

    </div>

    app.jsscript>

    <script>

        if ("serviceWorker" in navigator) {

            navigator.serviceWorker.register(
                "./service-worker.js"
            );

        }

    </script>

</body>

</html>
