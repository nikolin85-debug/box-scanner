<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
 
<title>Box Scanner</title>
 
<link rel="manifest" href="manifest.json">
 
ent="#1976d2">
 
<script src="https://unpkgt/xlsx.full.min.jsscript>
<script src="https://unpkg.com/html5-qrcodele>
 
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}
 
.card{
background:#fff;
padding:15px;
border-radius:10px;
margin-bottom:10px;
}
 
.stats{
display:flex;
gap:10px;
}
 
.stat{
flex:1;
padding:15px;
color:white;
text-align:center;
border-radius:10px;
font-size:20px;
}
 
.men{background:#1976d2;}
.women{background:#9c27b0;}
.kids{background:#4caf50;}
 
.result{
font-size:24px;
text-align:center;
font-weight:bold;
padding:20px;
}
 
button{
width:100%;
padding:15px;
font-size:18px;
margin-top:10px;
}
 
#reader{
width:100%;
}
 
</style>
 
</head>
 
<body>
 
<h2>📦 Box Scanner</h2>
 
<div class="card">
 
<input type="file"
id="excelFile"
accept=".xlsx,.xls">
 
<button onclick="startScanner()">
📷 Начать сканирование
</button>
 
</div>
 
<div id="reader"></div>
 
<div class="card">
 
<div class="stats">
 
<div class="stat men">
MEN
<br>
<span id="menCount">0</span>
</div>
 
<div class="stat women">
WOMEN
<br>
<span id="womenCount">0</span>
</div>
 
<div class="stat kids">
KIDS
<br>
<span id="kidsCount">0</span>
</div>
 
</div>
 
</div>
 
<div class="card">
<div id="result" class="result"></div>
</div>
 
<script>
 
let boxes = {};
let found = new Set();
 
const beepMen =
new Audio("sounds/men.mp3");
 
const beepWomen =
new Audio("sounds/women.mp3");
 
const beepKids =
new Audio("sounds/kids.mp3");
 
const savedBoxes =
localStorage.getItem("boxes");
 
if(savedBoxes){
boxes =
JSON.parse(savedBoxes);
}
 
const savedFound =
localStorage.getItem("found");
 
if(savedFound){
found =
new Set(JSON.parse(savedFound));
}
 
updateStats();
 
document
.getElementById("excelFile")
.addEventListener(
"change",
loadExcel
);
 
function loadExcel(e){
 
const file =
e.target.files[0];
 
const reader =
new FileReader();
 
reader.onload =
function(evt){
 
const data =
new Uint8Array(
evt.target.result
);
 
const workbook =
XLSX.read(
data,
{type:"array"}
);
 
const sheet =
workbook.Sheets[
workbook.SheetNames[0]
];
 
const rows =
XLSX.utils.sheet_to_json(
sheet,
{header:1}
);
 
boxes = {};
 
for(let i=1;i<rows.length;i++){
 
const row = rows[i];
 
if(row[0])
boxes[row[0]]="MEN";
 
if(row[1])
boxes[row[1]]="WOMEN";
 
if(row[2])
boxes[row[2]]="KIDS";
 
}
 
localStorage.setItem(
"boxes",
JSON.stringify(boxes)
);
 
updateStats();
 
alert(
"Загружено " +
Object.keys(boxes).length +
" коробов"
);
 
};
 
reader.readAsArrayBuffer(file);
}
 
function updateStats(){
 
let men=0;
let women=0;
let kids=0;
 
for(let code in boxes){
 
if(found.has(code))
continue;
 
if(boxes[code]==="MEN")
men++;
 
if(boxes[code]==="WOMEN")
women++;
 
if(boxes[code]==="KIDS")
kids++;
 
}
 
document.getElementById(
"menCount"
).textContent=men;
 
document.getElementById(
"womenCount"
).textContent=women;
 
document.getElementById(
"kidsCount"
).textContent=kids;
 
}
 
function saveFound(){
 
localStorage.setItem(
"found",
JSON.stringify([...found])
);
 
}
 
function processCode(code){
 
const result =
document.getElementById(
"result"
);
 
if(found.has(code)){
 
result.innerHTML =
"⚠ Уже найден<br>"+code;
 
return;
}
 
const category =
boxes[code];
 
if(!category){
 
result.innerHTML =
"❌ Нет в списке<br>"+code;
 
return;
}
 
found.add(code);
 
saveFound();
 
if(category==="MEN")
beepMen.play();
 
if(category==="WOMEN")
beepWomen.play();
 
if(category==="KIDS")
beepKids.play();
 
updateStats();
 
result.innerHTML =
"✅ "+category+
"<br>"+code;
}
 
function startScanner(){
 
const scanner =
new Html5Qrcode("reader");
 
scanner.start(
{facingMode:"environment"},
{
fps:10,
qrbox:250
},
(decodedText)=>{
 
processCode(decodedText);
 
}
);
 
}
 
if("serviceWorker" in navigator){
 
navigator.serviceWorker.register(
"./service-worker.js"
);
 
}
 
</script>
 
</body>
</html>
